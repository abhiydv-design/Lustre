<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lustre – Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121015}
*{box-sizing:border-box}
a{color:#D4B26A}a:hover{color:#E8CB8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #121015; color: #F3EEE6; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: 0.5px; color: #D4B26A">Lustre</div>
      <a href="Credits.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A3440; background: #1C1920; color: #F3EEE6; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4B26A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20"></path></svg>
        24 credits
      </a>
    </div>

    <div style="background: #1C1920; border: 1px solid #3A3440; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; line-height: 1.05; font-weight: 600">Studio photos of your own pieces, in 4K.</div>
      <div style="font-size: 15px; line-height: 1.5; color: #B9B0BE">Upload a phone photo. We keep your actual piece and build the studio around it.</div>
      <a href="Upload.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 14px; background: #D4B26A; color: #1A1408; font-weight: 700; font-size: 16px; text-decoration: none; margin-top: 6px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Start a new shoot
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Recent shoots</h2>
        <a href="Results.dc.html" style="font-size: 14px; font-weight: 600">See all</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{recent}}" as="item" hint-placeholder-count="4">
          <a href="Results.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #F3EEE6">
            <div style="aspect-ratio: 1 / 1; border-radius: 16px; background: {{item.bg}}; display: flex; align-items: center; justify-content: center; border: 1px solid #3A3440">
              <sc-if value="{{item.ring}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 96 96" width="68%" height="68%" fill="none" aria-hidden="true"><ellipse cx="48" cy="86" rx="22" ry="4" fill="#000000" opacity="0.18"></ellipse><circle cx="48" cy="57" r="22" stroke="#C9A04E" stroke-width="7"></circle><path d="M36 30 L42 22 H54 L60 30 L48 42 Z" fill="#EEF4F8" stroke="#9FB3C2" stroke-width="1.5" stroke-linejoin="round"></path><path d="M36 30 H60 M42 22 L48 30 L54 22 M48 30 V42" stroke="#9FB3C2" stroke-width="1"></path></svg>
              </sc-if>
              <sc-if value="{{item.pendant}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 96 96" width="68%" height="68%" fill="none" aria-hidden="true"><path d="M18 10 Q48 58 78 10" stroke="#C9A04E" stroke-width="2.5"></path><circle cx="48" cy="38" r="4" stroke="#C9A04E" stroke-width="2.5"></circle><path d="M48 44 L61 60 L48 82 L35 60 Z" fill="#E7C9D1" stroke="#B48792" stroke-width="1.5" stroke-linejoin="round"></path><path d="M35 60 H61 M48 44 V82" stroke="#B48792" stroke-width="1"></path></svg>
              </sc-if>
              <sc-if value="{{item.earrings}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 96 96" width="68%" height="68%" fill="none" aria-hidden="true"><circle cx="30" cy="30" r="8" fill="#EEF4F8" stroke="#C9A04E" stroke-width="3"></circle><path d="M30 38 L38 56 L30 74 L22 56 Z" fill="#CFE3D6" stroke="#7FA38C" stroke-width="1.5" stroke-linejoin="round"></path><circle cx="66" cy="30" r="8" fill="#EEF4F8" stroke="#C9A04E" stroke-width="3"></circle><path d="M66 38 L74 56 L66 74 L58 56 Z" fill="#CFE3D6" stroke="#7FA38C" stroke-width="1.5" stroke-linejoin="round"></path></svg>
              </sc-if>
            </div>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{item.label}}</span>
              <span style="font-size: 13px; color: #B9B0BE">{{item.meta}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #2E2934; background: #17141B; padding: 6px 8px 14px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #D4B26A; text-decoration: none; font-size: 12px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"></path></svg>
      Home
    </a>
    <a href="Upload.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #B9B0BE; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      New shoot
    </a>
    <a href="Results.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #B9B0BE; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>
      Gallery
    </a>
    <a href="Credits.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 52px; justify-content: center; color: #B9B0BE; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20"></path></svg>
      Credits
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var marble = 'linear-gradient(135deg,#F4F2EE 0%,#E3DED7 42%,#F7F5F1 58%,#D9D3CA 100%)';
    var velvet = 'radial-gradient(circle at 50% 40%,#43244A,#1D0F20)';
    var white = '#FFFFFF';
    var silk = 'linear-gradient(160deg,#F3E3D3,#D7B596 55%,#F1DCC6)';
    var items = [
      { label: 'Solitaire ring', meta: 'Marble · 4 photos', bg: marble, kind: 'ring' },
      { label: 'Ruby pendant', meta: 'Velvet · 4 photos', bg: velvet, kind: 'pendant' },
      { label: 'Emerald drops', meta: 'White catalog · 6 photos', bg: white, kind: 'earrings' },
      { label: 'Band ring', meta: 'Silk drape · 4 photos', bg: silk, kind: 'ring' }
    ];
    return {
      recent: items.map(function (it) {
        return Object.assign({}, it, { ring: it.kind === 'ring', pendant: it.kind === 'pendant', earrings: it.kind === 'earrings' });
      })
    };
  }
}
</script>
</body>
</html>
