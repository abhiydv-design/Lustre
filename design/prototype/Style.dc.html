<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lustre – Choose a look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121015}
*{box-sizing:border-box}
a{color:#D4B26A}a:hover{color:#E8CB8A}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #121015; color: #F3EEE6; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a href="Upload.dc.html" aria-label="Back to upload" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #F3EEE6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1 1 auto; font-size: 17px; font-weight: 700">New shoot</div>
    <div style="font-size: 13px; color: #B9B0BE; padding-right: 8px">Step 2 of 3</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 0 20px 8px" aria-hidden="true">
    <div style="height: 4px; border-radius: 4px; background: #D4B26A"></div>
    <div style="height: 4px; border-radius: 4px; background: #D4B26A"></div>
    <div style="height: 4px; border-radius: 4px; background: #3A3440"></div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 22px">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; line-height: 1.1; font-weight: 600">Choose a look</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{looks}}" as="l" hint-placeholder-count="6">
        <button type="button" onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="padding: 6px; border-radius: 18px; border: 2px solid {{l.border}}; background: #1C1920; color: #F3EEE6; display: flex; flex-direction: column; gap: 8px; text-align: left">
          <div style="width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; background: {{l.bg}}; display: flex; align-items: center; justify-content: center; position: relative">
            <svg viewBox="0 0 96 96" width="62%" height="62%" fill="none" aria-hidden="true"><ellipse cx="48" cy="86" rx="22" ry="4" fill="#000000" opacity="0.2"></ellipse><circle cx="48" cy="57" r="22" stroke="#C9A04E" stroke-width="7"></circle><path d="M36 30 L42 22 H54 L60 30 L48 42 Z" fill="#EEF4F8" stroke="#9FB3C2" stroke-width="1.5" stroke-linejoin="round"></path><path d="M36 30 H60 M42 22 L48 30 L54 22 M48 30 V42" stroke="#9FB3C2" stroke-width="1"></path></svg>
            <sc-if value="{{l.pro}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 999px; background: #121015; color: #D4B26A; font-size: 11px; font-weight: 700; letter-spacing: 0.4px">PRO</span>
            </sc-if>
          </div>
          <div style="padding: 0 6px 6px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">{{l.label}}</span>
            <span style="font-size: 12px; color: #B9B0BE">{{l.sub}}</span>
          </div>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 700">Format</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{formats}}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="min-height: 56px; border-radius: 12px; border: 1px solid {{f.border}}; background: {{f.fill}}; color: {{f.ink}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span style="font-size: 14px; font-weight: 700">{{f.label}}</span>
            <span style="font-size: 11px; font-weight: 600; opacity: 0.85">{{f.sub}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 14px; font-weight: 700">Variations to generate</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.fill}}; color: {{c.ink}}; font-size: 15px; font-weight: 700">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="padding: 12px 20px 20px; border-top: 1px solid #2E2934; background: #17141B; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #B9B0BE">
      <span>{{summary}}</span>
      <span style="color: #F3EEE6; font-weight: 700">Pay only for downloads</span>
    </div>
    <a href="Generating.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border-radius: 14px; background: #D4B26A; color: #1A1408; font-weight: 700; font-size: 16px; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
      Generate photos
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { look: 'Marble', format: '1:1', count: '4' };
  }
  pills(list, current, key) {
    var self = this;
    return list.map(function (x) {
      var on = x.label === current;
      return Object.assign({}, x, {
        on: on,
        border: on ? '#D4B26A' : '#3A3440',
        fill: on ? '#D4B26A' : '#1C1920',
        ink: on ? '#1A1408' : '#F3EEE6',
        pick: function () { var s = {}; s[key] = x.label; self.setState(s); }
      });
    });
  }
  renderVals() {
    var looks = [
      { label: 'White catalog', sub: 'Amazon · Flipkart ready', bg: '#FFFFFF' },
      { label: 'Marble', sub: 'Clean luxury', bg: 'linear-gradient(135deg,#F4F2EE 0%,#E3DED7 42%,#F7F5F1 58%,#D9D3CA 100%)' },
      { label: 'Velvet tray', sub: 'Classic showroom', bg: 'radial-gradient(circle at 50% 40%,#43244A,#1D0F20)' },
      { label: 'Silk drape', sub: 'Soft and warm', bg: 'linear-gradient(160deg,#F3E3D3,#D7B596 55%,#F1DCC6)' },
      { label: 'Festive', sub: 'Diwali · weddings', bg: 'radial-gradient(circle at 30% 30%,#8A2A1E,#3B0B0B)' },
      { label: 'On model', sub: 'Worn on a person', bg: 'linear-gradient(180deg,#C9A28A,#9C7563)', pro: true }
    ];
    var formats = [
      { label: '1:1', sub: 'Marketplace' },
      { label: '4:5', sub: 'Instagram' },
      { label: '16:9', sub: 'Web banner' }
    ];
    var counts = [{ label: '2' }, { label: '4' }, { label: '6' }];
    var px = { '1:1': '3840 × 3840', '4:5': '3072 × 3840', '16:9': '3840 × 2160' };
    return {
      looks: this.pills(looks, this.state.look, 'look'),
      formats: this.pills(formats, this.state.format, 'format'),
      counts: this.pills(counts, this.state.count, 'count'),
      summary: this.state.count + ' previews · ' + px[this.state.format] + ' px'
    };
  }
}
</script>
</body>
</html>
